name: Cloudsmith CLI Setup
description: "Install the standalone Cloudsmith CLI in GitHub Actions and configure API key or OIDC authentication. No Python or Node.js required. Secure drop-in replacement for cloudsmith-io/cloudsmith-cli-action."
author: 'step-security'

branding:
  icon: 'box'
  color: 'blue'

inputs:
  cli-version:
    description: "Cloudsmith CLI version to install, for example '1.20.0', or 'latest'."
    required: false
    default: 'latest'
  install-directory:
    description: "Root directory for versioned CLI installations. Defaults to RUNNER_TEMP/cloudsmith-cli."
    required: false
    default: ''
  api-key:
    description: 'API Key for Cloudsmith. Prefer OIDC for CI/CD workloads.'
    required: false
    default: ''
  oidc-namespace:
    description: 'Cloudsmith organisation/namespace for OIDC authentication.'
    required: false
    default: ''
  oidc-service-slug:
    description: 'Cloudsmith service account slug for OIDC authentication.'
    required: false
    default: ''
  oidc-auth-only:
    description: "Deprecated alias for export-auth-token. When true, it enables the same CLI credential-helper flow."
    required: false
    default: 'false'
  oidc-audience:
    description: "Audience to request for the GitHub OIDC token. Defaults to https://github.com/{repository-owner}."
    required: false
    default: ''
  verify-auth:
    description: "Run 'cloudsmith whoami' after setup to verify authentication."
    required: false
    default: 'false'
  export-auth-token:
    description: "Resolve credentials with 'cloudsmith credential-helper generic', then export its password as CLOUDSMITH_API_KEY and username as CLOUDSMITH_USERNAME. Requires Cloudsmith CLI 1.21.0 or later."
    required: false
    default: 'false'
  api-host:
    description: 'API host override for Cloudsmith.'
    required: false
    default: ''
  api-proxy:
    description: 'API proxy for Cloudsmith.'
    required: false
    default: ''
  api-ssl-verify:
    description: 'Verify SSL certificates for the Cloudsmith API: true, false, or empty for the CLI default.'
    required: false
    default: ''
  api-user-agent:
    description: 'User agent override for the Cloudsmith API.'
    required: false
    default: ''

outputs:
  cli-version:
    description: "Resolved Cloudsmith CLI version."
    value: ${{ steps.setup-posix.outputs.cli-version || steps.setup-windows.outputs.cli-version }}
  target:
    description: "Resolved standalone binary target, for example linux-x86_64-gnu."
    value: ${{ steps.setup-posix.outputs.target || steps.setup-windows.outputs.target }}
  cli-path:
    description: "Absolute path to the Cloudsmith CLI executable."
    value: ${{ steps.setup-posix.outputs.cli-path || steps.setup-windows.outputs.cli-path }}
  bin-directory:
    description: "Directory added to PATH for subsequent steps."
    value: ${{ steps.setup-posix.outputs.bin-directory || steps.setup-windows.outputs.bin-directory }}
  oidc-token:
    description: "Effective authentication token resolved by the CLI when export-auth-token or its oidc-auth-only alias is enabled. Masked in workflow logs."
    value: ${{ steps.setup-posix.outputs.oidc-token || steps.setup-windows.outputs.oidc-token }}

runs:
  using: "composite"
  steps:
    - name: Subscription check
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        # validate subscription status
        UPSTREAM="cloudsmith-io/cloudsmith-cli-action"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi
      shell: bash
    - name: Install and configure Cloudsmith CLI
      id: setup-posix
      if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        INPUT_INSTALL_DIRECTORY: ${{ inputs.install-directory }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_OIDC_NAMESPACE: ${{ inputs.oidc-namespace }}
        INPUT_OIDC_SERVICE_SLUG: ${{ inputs.oidc-service-slug }}
        INPUT_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        INPUT_API_HOST: ${{ inputs.api-host }}
        INPUT_API_PROXY: ${{ inputs.api-proxy }}
        INPUT_API_SSL_VERIFY: ${{ inputs.api-ssl-verify }}
        INPUT_API_USER_AGENT: ${{ inputs.api-user-agent }}
        INPUT_VERIFY_AUTH: ${{ inputs.verify-auth }}
        INPUT_EXPORT_AUTH_TOKEN: ${{ inputs.export-auth-token }}
        INPUT_OIDC_AUTH_ONLY: ${{ inputs.oidc-auth-only }}
      run: bash "$GITHUB_ACTION_PATH/scripts/setup.sh"

    - name: Install and configure Cloudsmith CLI
      id: setup-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        INPUT_INSTALL_DIRECTORY: ${{ inputs.install-directory }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_OIDC_NAMESPACE: ${{ inputs.oidc-namespace }}
        INPUT_OIDC_SERVICE_SLUG: ${{ inputs.oidc-service-slug }}
        INPUT_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        INPUT_API_HOST: ${{ inputs.api-host }}
        INPUT_API_PROXY: ${{ inputs.api-proxy }}
        INPUT_API_SSL_VERIFY: ${{ inputs.api-ssl-verify }}
        INPUT_API_USER_AGENT: ${{ inputs.api-user-agent }}
        INPUT_VERIFY_AUTH: ${{ inputs.verify-auth }}
        INPUT_EXPORT_AUTH_TOKEN: ${{ inputs.export-auth-token }}
        INPUT_OIDC_AUTH_ONLY: ${{ inputs.oidc-auth-only }}
      run: '& "$env:GITHUB_ACTION_PATH\scripts\setup.ps1"'
